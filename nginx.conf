# Server block for the KIA / Urbex dashboard (replaces nginx's default.conf).
# Listens on 8080 to match DigitalOcean App Platform's http_port.
server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # --- Compression (the dashboard is a big self-contained HTML file) ---
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types        text/html text/css text/plain
                      application/javascript application/json
                      image/svg+xml;

    # --- Safe, non-breaking headers ---
    # NOTE: intentionally no Content-Security-Policy — the map loads Leaflet
    # (unpkg), Google Fonts and external tile servers; a strict CSP breaks it.
    add_header X-Content-Type-Options "nosniff"                     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # The HTML shell changes on every deploy, so never cache it hard.
    add_header Cache-Control          "no-cache"                    always;

    # Serve the dashboard; anything unknown falls back to it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Silence favicon 404 noise.
    location = /favicon.ico { access_log off; log_not_found off; }
}
