# ============================================================================
#  DigitalOcean App Platform spec — KIA / Urbex dashboard
#
#  The dashboard is ONE self-contained index.html (data travels encrypted
#  inside the file), so it ships as a STATIC SITE: no container, no port to
#  listen on, no runtime. That removes the whole class of "service started but
#  nothing answers on the port" 404s, and it is cheaper than a Service.
#
#  First deploy:
#     doctl apps create --spec .do/app.yaml
#  Update an existing app:
#     doctl apps update <APP_ID> --spec .do/app.yaml
#
#  In the dashboard: Apps -> Create -> GitHub -> this repo, then make sure the
#  component type is "Static Site" (NOT "Web Service"). GitHub has to be
#  connected to your DigitalOcean account first.
#
#  A Dockerfile + nginx.conf are still in the repo for the day this needs a
#  real backend (e.g. querying MySQL). They are unused by this spec. If DO
#  insists on auto-detecting the Dockerfile and building a container, rename it
#  to Dockerfile.container and redeploy.
# ============================================================================
name: kia-urbex-dashboard
region: nyc                       # closest DO region to Bogotá

static_sites:
  - name: web
    source_dir: /                 # index.html lives at the repo root

    github:
      repo: nicolas04rodriguez-debug/KIA---Dashboards
      branch: main
      deploy_on_push: true        # every push to main redeploys

    # No build step: the file is already the artifact.
    index_document: index.html
    error_document: index.html
    catchall_document: index.html # single-page dashboard, all paths -> index

    routes:
      - path: /
